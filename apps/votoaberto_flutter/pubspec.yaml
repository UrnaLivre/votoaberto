name: votoaberto
description: Explorador independente de resultados presidenciais locais e demonstrativos.
publish_to: none
version: 0.5.0+3

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.0.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  in_app_update: ^5.0.0
  package_info_plus: ^10.0.0
  shared_preferences: ^2.5.6
  url_launcher_web: ^2.4.3
  url_launcher_platform_interface: ^2.3.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geo/br_states.geojson
    - assets/geo/municipal_locations.json
    - assets/geo/overseas_correspondence.json
    - assets/geo/world.geojson
    - assets/geo/manifest.json
    - assets/fonts/LICENSE-Roboto.txt
    # BEGIN EMBEDDED ASSETS
    - assets/data/synthetic/
    - assets/data/synthetic/municipalities/
    # END EMBEDDED ASSETS
  fonts:
    - family: VotoSans
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700

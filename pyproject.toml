[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "votoaberto-data"
version = "0.3.1"
description = "Motor de dados TSE e VotoAberto Auditor"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[project.scripts]
votoaberto-auditor = "votoaberto_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["pipelines", "apps/votoaberto_auditor"]
include = ["tse_importer*", "votoaberto_auditor*"]

[tool.setuptools.package-data]
tse_importer = ["schemas.json"]

[tool.pytest.ini_options]
pythonpath = ["pipelines", "apps/votoaberto_auditor"]
testpaths = ["tests"]
markers = ["official: opt-in local official ZIP integration"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # SQL statements are formatted as readable logical clauses.

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["tse_importer.domain.Limits", "Limits"]

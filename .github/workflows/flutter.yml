name: Flutter

on:
  push:
    # Validate the current working branch without tying CI to its temporary name.
    paths: ['apps/votoaberto_flutter/**', 'pipelines/tse_importer/embedded*.py', 'pipelines/tse_importer/country_exporter.py', 'tools/geography/**', 'tests/test_web_release.py', '.github/workflows/flutter.yml', '.github/workflows/deploy-web.yml']
  pull_request:
    branches: [main]
    paths: ['apps/votoaberto_flutter/**', 'pipelines/tse_importer/embedded*.py', 'pipelines/tse_importer/country_exporter.py', 'tools/geography/**', 'tests/test_web_release.py', '.github/workflows/flutter.yml', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  # Never interrupt an in-flight production upload when main receives a new commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: '3.47.8'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  WRANGLER_SEND_METRICS: 'false'

defaults:
  run:
    working-directory: apps/votoaberto_flutter

jobs:
  quality-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python tool/native_release.py check-version --previous-ref origin/main
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: python tool/embedded_build.py web --mode fixture
      - run: python tool/web_release.py audit --mode fixture --report ../../.local/web-artifact-audit.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/votoaberto_flutter/.node-version
          cache: npm
          cache-dependency-path: apps/votoaberto_flutter/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run deploy:check
      - uses: actions/upload-artifact@v4
        with:
          name: votoaberto-web-fixture-${{ github.sha }}
          path: |
            apps/votoaberto_flutter/build/web
            .local/web-artifact-audit.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            apps/votoaberto_flutter/test-results
            apps/votoaberto_flutter/playwright-report
          retention-days: 7

  deploy:
    needs: [quality-web, windows, android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.WEB_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-web.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python tool/embedded_build.py windows --mode fixture

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python tool/embedded_build.py apk --mode fixture
      - name: Exercise Android Release refusals with a temporary test key
        env:
          RUN_ANDROID_RELEASE_GATES: 'true'
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest ../../tests/test_native_release.py -q -k gradle_release_gates

name: Data Engine
on:
  push:
    paths: ['pipelines/**', 'apps/votoaberto_auditor/**', 'apps/votoaberto_flutter/tool/**', 'tools/generate_embedded_fixture.py', 'tools/geography/**', 'tools/provenance/**', 'tests/**', 'pyproject.toml', '.github/workflows/data-engine.yml', '.github/workflows/native-production.yml']
  pull_request:
    paths: ['pipelines/**', 'apps/votoaberto_auditor/**', 'apps/votoaberto_flutter/tool/**', 'tools/generate_embedded_fixture.py', 'tools/geography/**', 'tools/provenance/**', 'tests/**', 'pyproject.toml', '.github/workflows/data-engine.yml', '.github/workflows/native-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff format --check pipelines/tse_importer apps/votoaberto_auditor tests tools/generate_embedded_fixture.py tools/geography tools/provenance apps/votoaberto_flutter/tool
      - run: python -m ruff check pipelines/tse_importer apps/votoaberto_auditor tests tools/generate_embedded_fixture.py tools/geography tools/provenance apps/votoaberto_flutter/tool
      - run: python -m pytest -q
      - run: votoaberto-auditor --help
